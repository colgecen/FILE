name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            label: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            label: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build
      - run: cargo build --release --manifest-path native/ai-helper/Cargo.toml
      - run: npx electron-builder --linux AppImage rpm tar.gz --${{ matrix.arch }} --publish never
      - name: Name assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp dist/*.AppImage "release/file-${version}-linux-${{ matrix.label }}.AppImage"
          cp dist/*.rpm "release/file-${version}-linux-${{ matrix.label }}.rpm"
          cp dist/*.tar.gz "release/file-${version}-linux-${{ matrix.label }}.tar.gz"
          ls -lh release
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.label }}
          path: release/*
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            label: x86_64
          - runner: windows-11-arm
            arch: arm64
            label: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build
      - run: cargo build --release --manifest-path native/ai-helper/Cargo.toml
      - run: npx electron-builder --win portable --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Name asset
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $exe = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "portable exe was not produced" }
          Copy-Item $exe.FullName "release/file-$version-windows-${{ matrix.label }}.exe"
          Get-ChildItem release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.label }}
          path: release/*
          if-no-files-found: error

  source:
    name: Source archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create source archive
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          git archive --format=tar.gz --prefix="file-${version}/" \
            -o "release/file-${version}-source.tar.gz" HEAD
          ls -lh release
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [linux, windows, source]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd release
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            ${prerelease} \
            release/*
