[package]
name = "ai-helper"
version = "0.1.0"
edition = "2021"
description = "FILE uygulamasının yerel yapay zekâ katmanı — llama.cpp tabanlı, stdio üzerinden JSONL konuşan yardımcı süreç"
license = "MIT"
publish = false

[[bin]]
name = "ai-helper"
path = "src/main.rs"

[dependencies]
llama-cpp-2 = "0.1.161"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8.35"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
